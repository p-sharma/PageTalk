<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PageTalk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    .error-box {
      margin: 16px;
      padding: 12px;
      border-radius: 6px;
      background: #fff0f0;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }
    .error-box strong { display: block; margin-bottom: 4px; }
    .error-box p { margin: 0; line-height: 1.5; }

    #loading-state { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
    .loading-label { margin: 0; font-weight: 600; }
    .progress-track {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    .progress-text {
      margin: 0;
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #chat-header {
      display: flex;
      justify-content: flex-end;
      padding: 4px 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    #clear-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #clear-btn:hover:not(:disabled) { color: #6b7280; background: #f3f4f6; }
    #clear-btn:disabled { color: #d1d5db; cursor: not-allowed; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message-user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message-assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .message-text { white-space: pre-wrap; word-break: break-word; }
    .tts-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      background: transparent;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      cursor: pointer;
      color: #6b7280;
      line-height: 0;
    }
    .tts-btn:hover { background: #e5e7eb; color: #374151; }

    .thinking-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 2px 0;
    }
    .thinking-indicator span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: dot-bounce 1.2s infinite ease-in-out;
    }
    .thinking-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    #input-area {
      border-top: 1px solid #e5e7eb;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
    }
    #user-input:focus { border-color: #2563eb; }
    #mic-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #d1d5db;
      cursor: not-allowed;
      line-height: 0;
    }
    #send-btn {
      padding: 8px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #1d4ed8; }
    #send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app"></div>
</body>
</html>
